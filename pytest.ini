[pytest]
# Auto asyncio mode: async test functions need no decorator
asyncio_mode = auto
# Keep all async tests in the same event loop per function.
# MCP stdio's anyio task group requires entering/exiting cancel scope
# within the same loop; closing across loops raises an error.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
# Import app/evals packages from project root
pythonpath = .
testpaths = tests
